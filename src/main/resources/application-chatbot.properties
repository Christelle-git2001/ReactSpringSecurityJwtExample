spring.ai.model.chat=openai

# Fichier local facultatif, exclu de Git. Les variables d'environnement restent utilisables.
spring.config.import=optional:file:./application-chatbot-local.properties

spring.ai.openai.base-url=${AZURE_OPENAI_BASE_URL}
spring.ai.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.openai.microsoft-deployment-name=${AZURE_OPENAI_DEPLOYMENT}
spring.ai.openai.chat.model=${AZURE_OPENAI_DEPLOYMENT}